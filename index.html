<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>श्री कृष्ण वाणी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --bg-deep:#070d16;
  --bg-mid:#0f1c2e;
  --bg-rise:#152a40;
  --brass:#c9925a;
  --brass-light:#e8bd8a;
  --brass-dim:#8a6440;
  --teal:#2f6f6b;
  --teal-light:#7db8ab;
  --ember:#ff6a4d;
  --text:#f2e9da;
  --text-muted:#a9b7c3;
  --glass-bot:rgba(20,32,46,0.6);
  --glass-user:rgba(46,64,55,0.5);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;}
body{
  font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--text);
  display:flex;
  flex-direction:column;
  height:100dvh;
  overflow:hidden;
  position:relative;
  background:
    radial-gradient(ellipse 700px 380px at 50% -40px, rgba(201,146,90,0.16), transparent 65%),
    radial-gradient(ellipse 600px 500px at 85% 15%, rgba(47,111,107,0.14), transparent 60%),
    linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 45%, var(--bg-rise) 100%);
}

/* ---------- ambient diya particles ---------- */
#particles{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.diya{
  position:absolute;bottom:-20px;border-radius:50%;
  background:radial-gradient(circle, rgba(232,189,138,0.9) 0%, rgba(232,189,138,0.25) 55%, transparent 75%);
  animation:rise linear infinite;
  opacity:0;
}
@keyframes rise{
  0%{transform:translateY(0) scale(0.6);opacity:0}
  8%{opacity:.55}
  85%{opacity:.35}
  100%{transform:translateY(-108vh) scale(1);opacity:0}
}

/* ---------- header + feather mark ---------- */
header{
  position:relative;z-index:3;text-align:center;
  padding:24px 20px 14px;flex-shrink:0;
}
.menu-wrap{position:absolute;top:16px;left:16px;z-index:5}
.menu-btn{
  width:36px;height:36px;border-radius:9px;border:1px solid rgba(201,146,90,0.35);
  background:rgba(7,13,22,0.5);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.menu-btn span{display:block;width:16px;height:1.5px;border-radius:2px;background:var(--brass-light)}
.menu-dropdown{
  position:absolute;top:42px;left:0;min-width:160px;
  background:linear-gradient(180deg,#182b3e,#0d1826);
  border:1px solid rgba(201,146,90,0.25);border-radius:12px;
  box-shadow:0 14px 32px rgba(0,0,0,0.5);overflow:hidden;display:none;
}
.menu-dropdown.show{display:block}
.menu-item{
  padding:12px 16px;font-size:13.5px;color:var(--text);cursor:pointer;
  text-align:left;background:none;border:none;width:100%;font-family:inherit;
}
.menu-item:not(:last-child){border-bottom:1px solid rgba(201,146,90,0.1)}
.menu-item:active{background:rgba(201,146,90,0.1)}

.feather-mark{width:118px;height:52px;margin:0 auto;display:block;overflow:visible;animation:sway 7s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.feather-mark .quill{stroke:var(--brass-dim);stroke-width:1.1;fill:none;opacity:.8}
.feather-mark .barb{stroke:var(--teal-light);stroke-width:1;fill:none;opacity:.55}
.feather-mark .eye{fill:none;stroke:var(--brass-light);stroke-width:1.4}
.feather-mark .eye-core{fill:var(--brass-light);opacity:.9}

header .title{
  margin-top:6px;
  font-family:'Tiro Devanagari Hindi',serif;
  font-size:26px;font-weight:400;letter-spacing:.5px;color:var(--brass-light);
  text-shadow:0 0 18px rgba(201,146,90,0.35);
}
header .sub{
  font-size:13.5px;color:var(--text-muted);margin-top:5px;font-weight:400;letter-spacing:.2px;
}
.divider{
  width:64px;height:1px;margin:14px auto 0;
  background:linear-gradient(90deg, transparent, var(--teal-light), var(--brass-light), transparent);
  opacity:.6;
}

/* ---------- chat ---------- */
#chat{
  position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;
  padding:16px 14px 8px;display:flex;flex-direction:column;gap:12px;
}
#chat::-webkit-scrollbar{width:0}
.row{display:flex;align-items:flex-end;gap:8px;animation:pop .28s ease}
.row.user{flex-direction:row-reverse}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;border:1px solid rgba(255,255,255,0.08)}
.av.bot{background:linear-gradient(135deg,#2f6f6b,#1a4340);color:var(--brass-light)}
.av.user{background:linear-gradient(135deg,#3d5a4c,#25382e);color:var(--text)}
.bubble{
  max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.65;font-size:15px;
  white-space:pre-wrap;word-wrap:break-word;
  box-shadow:0 8px 22px rgba(0,0,0,.28);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.user .bubble{background:var(--glass-user);color:var(--text);border:1px solid rgba(125,184,171,0.22);border-bottom-right-radius:5px}
.bot .bubble{background:var(--glass-bot);border:1px solid rgba(201,146,90,0.2);color:var(--text);border-bottom-left-radius:5px}

/* flute waveform loading state */
.waveform{display:inline-flex;align-items:center;gap:3px;height:16px}
.waveform i{
  width:3px;border-radius:2px;background:var(--brass-light);display:inline-block;
  animation:wave 1s ease-in-out infinite;
}
.waveform i:nth-child(1){height:6px;animation-delay:0s}
.waveform i:nth-child(2){height:14px;animation-delay:.12s}
.waveform i:nth-child(3){height:9px;animation-delay:.24s}
.waveform i:nth-child(4){height:16px;animation-delay:.36s}
.waveform i:nth-child(5){height:7px;animation-delay:.48s}
@keyframes wave{0%,100%{transform:scaleY(.4);opacity:.6}50%{transform:scaleY(1);opacity:1}}

.playbtn{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:rgba(201,146,90,0.1);border:1px solid rgba(201,146,90,0.32);
  color:var(--brass-light);padding:6px 14px;border-radius:13px;font-size:12.5px;font-family:inherit;cursor:pointer;
}

/* ---------- input bar ---------- */
#bar{
  position:relative;z-index:3;display:flex;gap:8px;flex-shrink:0;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(7,13,22,0.6);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(201,146,90,0.16);
}
#msg{
  flex:1;min-width:0;padding:13px 16px;border-radius:22px;
  border:1px solid rgba(201,146,90,0.22);
  background:rgba(255,255,255,0.04);
  color:var(--text);font-size:16px;font-family:inherit;outline:none;transition:border .2s;
}
#msg::placeholder{color:var(--text-muted)}
#msg:focus{border-color:var(--teal-light)}
#mic,#send{width:48px;height:48px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
#mic svg,#send svg{width:20px;height:20px}
#mic{border:1px solid rgba(125,184,171,0.35);background:rgba(47,111,107,0.15);color:var(--teal-light);touch-action:none;user-select:none;-webkit-user-select:none}
#mic.rec{background:linear-gradient(135deg,#ff6a4d,#e8483a);color:#fff;border-color:transparent;animation:pulse 1s infinite}
#send{border:none;background:linear-gradient(135deg,var(--brass-light),var(--brass));color:#241608;box-shadow:0 4px 14px rgba(201,146,90,.4)}
#send:active,#mic:active{transform:scale(.9)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,106,77,.55)}70%{box-shadow:0 0 0 12px rgba(255,106,77,0)}100%{box-shadow:0 0 0 0 rgba(255,106,77,0)}}

/* ---------- modals ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:50;background:rgba(4,8,14,0.78);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .25s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-card{
  background:linear-gradient(180deg,#18293c,#0c1622);
  border:1px solid rgba(201,146,90,0.28);border-radius:16px;
  padding:26px 24px 22px;max-width:320px;width:100%;text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,0.55);
  transform:translateY(10px);transition:transform .25s ease;
}
.modal-overlay.show .modal-card{transform:translateY(0)}
.modal-card .icon-mark{width:44px;height:20px;margin:0 auto 12px}
.modal-card h3{margin:0 0 10px;font-size:18px;font-weight:600;color:var(--brass-light);font-family:'Tiro Devanagari Hindi',serif}
.modal-card p{margin:0 0 20px;font-size:13.5px;color:var(--text-muted);line-height:1.6}
.modal-btn{
  display:inline-block;width:100%;
  background:linear-gradient(135deg,var(--brass-light),var(--brass));
  color:#241608;font-weight:600;font-size:14.5px;padding:12px 0;border-radius:11px;
  text-decoration:none;border:none;cursor:pointer;
}
.modal-close{display:block;margin:14px auto 0;background:none;border:none;color:var(--text-muted);font-size:12.5px;cursor:pointer}
.lang-btn-row{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lang-choice{
  display:block;width:100%;padding:13px 0;border-radius:11px;
  background:rgba(47,111,107,0.12);border:1px solid rgba(125,184,171,0.32);
  color:var(--teal-light);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
}
.lang-choice:active{background:rgba(47,111,107,0.22)}
</style></head><body>

<div id="particles"></div>

<header>
  <div class="menu-wrap">
    <button class="menu-btn" id="menuBtn" title="Menu"><span></span><span></span><span></span></button>
    <div class="menu-dropdown" id="menuDropdown">
      <button class="menu-item" id="menuProfileBtn">प्रोफ़ाइल</button>
      <button class="menu-item" id="menuLangBtn">भाषा / Language</button>
    </div>
  </div>

  <svg class="feather-mark" viewBox="0 0 118 52" aria-hidden="true">
    <path class="quill" d="M4 48 C 30 30, 55 12, 59 4"/>
    <path class="barb" d="M14 44 C 22 34, 28 26, 30 20"/>
    <path class="barb" d="M24 38 C 32 28, 38 20, 41 14"/>
    <path class="barb" d="M34 30 C 42 22, 47 16, 50 11"/>
    <ellipse class="eye" cx="88" cy="16" rx="20" ry="12" transform="rotate(-18 88 16)"/>
    <ellipse class="eye-core" cx="88" cy="16" rx="5" ry="3.2" transform="rotate(-18 88 16)"/>
  </svg>

  <div class="title" id="headerTitle">श्री कृष्ण वाणी</div>
  <div class="divider"></div>
  <div class="sub" id="headerSub">आपके प्रश्न, श्री कृष्ण के उत्तर</div>
</header>

<div id="chat"></div>

<div id="bar">
<button id="mic" title="बोलें"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21a1 1 0 1 0 2 0v-3.08A7 7 0 0 0 19 11z"/></svg></button>
<input id="msg" autocomplete="off">
<button id="send" title="भेजें"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.4.92V9.6a1 1 0 0 0 .78.98L14 12 2.78 13.42a1 1 0 0 0-.78.98v5.08a1 1 0 0 0 1.4.92z"/></svg></button>
</div>

<div class="modal-overlay" id="subModal">
  <div class="modal-card">
    <svg class="icon-mark" viewBox="0 0 44 20" aria-hidden="true"><path d="M2 18 C 14 10, 24 5, 26 2" stroke="var(--brass-dim)" stroke-width="1" fill="none"/><ellipse cx="34" cy="7" rx="8" ry="5" transform="rotate(-18 34 7)" stroke="var(--brass-light)" stroke-width="1.2" fill="none"/><ellipse cx="34" cy="7" rx="2.2" ry="1.4" transform="rotate(-18 34 7)" fill="var(--brass-light)"/></svg>
    <h3 id="paywallTitle">निःशुल्क सीमा पूरी हुई</h3>
    <p id="paywallText">आपने 3 प्रश्न पूछ लिए हैं। आगे बातचीत जारी रखने के लिए कृपया दक्षिणा अर्पित करें।</p>
    <a class="modal-btn" href="subscribe.html" target="_blank" rel="noopener" id="paywallBtn">दक्षिणा दें</a>
  </div>
</div>

<div class="modal-overlay" id="langModal">
  <div class="modal-card">
    <svg class="icon-mark" viewBox="0 0 44 20" aria-hidden="true"><path d="M2 18 C 14 10, 24 5, 26 2" stroke="var(--teal)" stroke-width="1" fill="none"/><ellipse cx="34" cy="7" rx="8" ry="5" transform="rotate(-18 34 7)" stroke="var(--teal-light)" stroke-width="1.2" fill="none"/><ellipse cx="34" cy="7" rx="2.2" ry="1.4" transform="rotate(-18 34 7)" fill="var(--teal-light)"/></svg>
    <h3 id="langTitle">अपनी भाषा चुनें / Choose your language</h3>
    <div class="lang-btn-row">
      <button class="lang-choice" data-lang="hi">हिंदी</button>
      <button class="lang-choice" data-lang="en">English</button>
    </div>
    <button class="modal-close" id="langCloseBtn" style="display:none">बंद करें / Close</button>
  </div>
</div>

<script>
var WEBHOOK_URL = "https://ishikagarg.app.n8n.cloud/webhook/gita-voice";
var chat=document.getElementById("chat"),input=document.getElementById("msg"),btn=document.getElementById("send"),mic=document.getElementById("mic");
var LOTUS=String.fromCodePoint(129719),PRAY=String.fromCodePoint(128591);

/* ---- ambient diya particles ---- */
(function initParticles(){
  var wrap = document.getElementById("particles");
  var COUNT = 12;
  for(var i=0;i<COUNT;i++){
    var d = document.createElement("div");
    d.className = "diya";
    var size = 3 + Math.random()*5;
    d.style.width = size+"px";
    d.style.height = size+"px";
    d.style.left = (Math.random()*100)+"%";
    var dur = 14 + Math.random()*14;
    d.style.animationDuration = dur+"s";
    d.style.animationDelay = (-Math.random()*dur)+"s";
    wrap.appendChild(d);
  }
})();

/* ---- safe storage helpers (never crash if storage is blocked) ---- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var TXT = {
  hi:{
    title:"श्री कृष्ण वाणी",
    sub:"आपके प्रश्न, श्री कृष्ण के उत्तर",
    placeholder:"",
    micTitle:"बोलें",
    sendTitle:"भेजें",
    greeting:"नमस्ते प्रिय मित्र "+PRAY,
    listening:String.fromCodePoint(127908)+" सुन रहा हूँ...",
    voiceFallback:String.fromCodePoint(127908)+" (आपकी आवाज़)",
    noReply:"(कोई उत्तर नहीं)",
    error:"कुछ गड़बड़ हो गयी: ",
    micError:"माइक एक्सेस नहीं मिला: ",
    listenBtn:String.fromCodePoint(128266)+" सुनें",
    paywallTitle:"निःशुल्क सीमा पूरी हुई",
    paywallText:"आपने 3 प्रश्न पूछ लिए हैं। आगे बातचीत जारी रखने के लिए कृपया दक्षिणा अर्पित करें।",
    paywallBtn:"दक्षिणा दें",
    menuProfile:"प्रोफ़ाइल",
    menuLang:"भाषा / Language",
    langTitle:"अपनी भाषा चुनें / Choose your language",
    langClose:"बंद करें / Close",
    profileTitle:"प्रोफ़ाइल",
    profileMsgLabel:"पूछे गए प्रश्न",
    profileStatusLabel:"स्थिति",
    profileFree:"निःशुल्क उपयोगकर्ता",
    profilePaid:"सदस्यता सक्रिय",
    profileClose:"बंद करें"
  },
  en:{
    title:"Shri Krishna Vani",
    sub:"Your questions, Shri Krishna's answers",
    placeholder:"",
    micTitle:"Speak",
    sendTitle:"Send",
    greeting:"Namaste dear friend "+PRAY,
    listening:String.fromCodePoint(127908)+" Listening...",
    voiceFallback:String.fromCodePoint(127908)+" (your voice)",
    noReply:"(no reply)",
    error:"Something went wrong: ",
    micError:"Mic access denied: ",
    listenBtn:String.fromCodePoint(128266)+" Listen",
    paywallTitle:"Free limit reached",
    paywallText:"You've asked 3 questions. Please offer a small contribution to continue the conversation.",
    paywallBtn:"Contribute",
    menuProfile:"Profile",
    menuLang:"भाषा / Language",
    langTitle:"अपनी भाषा चुनें / Choose your language",
    langClose:"बंद करें / Close",
    profileTitle:"Profile",
    profileMsgLabel:"Questions asked",
    profileStatusLabel:"Status",
    profileFree:"Free user",
    profilePaid:"Subscription active",
    profileClose:"Close"
  }
};

var currentLang = lsGet("krishna_lang");
var greetingBubble = null;

function t(key){
  var lang = currentLang || "hi";
  return TXT[lang][key];
}

function applyStaticText(){
  document.getElementById("headerTitle").textContent = t("title");
  document.getElementById("headerSub").textContent = t("sub");
  input.placeholder = t("placeholder");
  mic.title = t("micTitle");
  btn.title = t("sendTitle");
  document.getElementById("paywallTitle").textContent = t("paywallTitle");
  document.getElementById("paywallText").textContent = t("paywallText");
  document.getElementById("paywallBtn").textContent = t("paywallBtn");
  document.getElementById("menuProfileBtn").textContent = t("menuProfile");
  document.getElementById("menuLangBtn").textContent = t("menuLang");
  document.getElementById("langTitle").textContent = t("langTitle");
  document.getElementById("langCloseBtn").textContent = t("langClose");
}

function add(txt,w){var row=document.createElement("div");row.className="row "+w;var av=document.createElement("div");av.className="av "+w;av.textContent=(w==="bot"?LOTUS:PRAY);var b=document.createElement("div");b.className="bubble";b.textContent=txt;row.appendChild(av);row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b;}
function addTyping(){
  var row=document.createElement("div");row.className="row bot";
  var av=document.createElement("div");av.className="av bot";av.textContent=LOTUS;
  var b=document.createElement("div");b.className="bubble";
  var wf=document.createElement("span");wf.className="waveform";
  for(var i=0;i<5;i++){wf.appendChild(document.createElement("i"));}
  b.appendChild(wf);
  row.appendChild(av);row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b;
}
function play(b64){var a=new Audio("data:audio/wav;base64,"+b64);a.play();}
function addPlay(bubble,b64){var pb=document.createElement("button");pb.className="playbtn";pb.textContent=t("listenBtn");pb.onclick=function(){play(b64);};bubble.appendChild(document.createElement("br"));bubble.appendChild(pb);}

/* ---- free-question limit (saved in the browser, survives reload) ---- */
var FREE_LIMIT = 3;
var msgCount = parseInt(lsGet("krishna_msgcount") || "0", 10);
if(isNaN(msgCount)) msgCount = 0;
function bumpCount(){
  msgCount++;
  lsSet("krishna_msgcount", String(msgCount));
}
var subModal = document.getElementById("subModal");
var langModal = document.getElementById("langModal");

function isUnlocked(){
  return lsGet("krishna_unlocked") === "true";
}
function showPaywall(){
  subModal.classList.add("show");
}
function canSendMessage(){
  if(isUnlocked()) return true;
  if(msgCount >= FREE_LIMIT){
    showPaywall();
    return false;
  }
  return true;
}

/* ---- device id (sent to the server so the limit can be enforced there too) ---- */
function getDeviceId(){
  var id = lsGet("krishna_device");
  if(!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("d-" + Date.now() + "-" + Math.random().toString(36).slice(2));
    lsSet("krishna_device", id);
  }
  return id;
}

/* ---- chat history (saved in the browser, restored after reload) ---- */
var HISTORY_KEY = "krishna_history";
var MAX_HISTORY = 40;
function loadHistory(){
  try{
    var h = JSON.parse(lsGet(HISTORY_KEY) || "[]");
    return Array.isArray(h) ? h : [];
  }catch(e){ return []; }
}
function saveHistory(w, txt){
  if(!txt) return;
  var h = loadHistory();
  h.push({w:w, t:txt});
  if(h.length > MAX_HISTORY) h = h.slice(h.length - MAX_HISTORY);
  lsSet(HISTORY_KEY, JSON.stringify(h));
}
function restoreHistory(){
  loadHistory().forEach(function(item){
    if(item && item.t && (item.w === "user" || item.w === "bot")){
      add(item.t, item.w);
    }
  });
}

/* server says the limit is reached: sync the local count and show the paywall */
function handleLimitReached(typingBubble){
  msgCount = FREE_LIMIT;
  lsSet("krishna_msgcount", String(FREE_LIMIT));
  if(typingBubble && typingBubble.parentNode && typingBubble.parentNode.parentNode){
    typingBubble.parentNode.parentNode.removeChild(typingBubble.parentNode);
  }
  showPaywall();
}

async function sendText(){
  var m=input.value.trim();
  if(!m)return;
  if(!canSendMessage())return;
  add(m,"user");
  saveHistory("user", m);
  input.value="";
  bumpCount();
  var L=addTyping();
  try{
    var res=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,sessionId:"mobile-user",lang:currentLang||"hi",deviceId:getDeviceId(),phone:lsGet("krishna_phone")||""})});
    var data=await res.json();
    if(data.limitReached){handleLimitReached(L);return;}
    var reply=data.reply||t("noReply");
    L.textContent=reply;
    saveHistory("bot", reply);
  }catch(e){
    L.textContent=t("error")+e.message;
  }
  chat.scrollTop=chat.scrollHeight;
}

var mediaRec=null,chunks=[],recording=false;
function startRecording(e){
  e.preventDefault();
  if(recording)return;
  if(!canSendMessage())return;
  if(e.pointerId!==undefined && mic.setPointerCapture){
    try{mic.setPointerCapture(e.pointerId);}catch(err){}
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaRec=new MediaRecorder(stream);
    chunks=[];
    mediaRec.ondataavailable=function(ev){
      if(ev.data && ev.data.size>0){chunks.push(ev.data);}
    };
    mediaRec.onstop=function(){
      recording=false;
      mic.classList.remove("rec");
      stream.getTracks().forEach(function(tr){tr.stop();});
      var finalBlob=new Blob(chunks,{type:"audio/webm"});
      if(finalBlob.size>0){sendVoice(finalBlob,"recording.webm");}
    };
    mediaRec.start();
    recording=true;
    mic.classList.add("rec");
  }).catch(function(e){
    alert(t("micError")+e.name+" - "+e.message);
  });
}
function stopRecording(e){
  if(e)e.preventDefault();
  if(recording && mediaRec){
    mediaRec.stop();
  }
}
async function sendVoice(blob,filename){
  var userBubble = add(t("listening"),"user");
  bumpCount();
  var L=addTyping();
  try{
    var fd=new FormData();
    fd.append("data",blob,filename||"recording.webm");
    fd.append("sessionId","mobile-user");
    fd.append("lang",currentLang||"hi");
    fd.append("deviceId",getDeviceId());
    fd.append("phone",lsGet("krishna_phone")||"");
    var res=await fetch(WEBHOOK_URL,{method:"POST",body:fd});
    var data=await res.json();
    if(data.limitReached){
      if(userBubble.parentNode && userBubble.parentNode.parentNode){
        userBubble.parentNode.parentNode.removeChild(userBubble.parentNode);
      }
      handleLimitReached(L);
      return;
    }
    if(data.transcript){
      userBubble.textContent = data.transcript;
    } else {
      userBubble.textContent = t("voiceFallback");
    }
    saveHistory("user", userBubble.textContent);
    var reply=data.reply||t("noReply");
    L.textContent=reply;
    saveHistory("bot", reply);
    if(data.audioBase64){addPlay(L,data.audioBase64);play(data.audioBase64);}
  }catch(e){
    userBubble.textContent = t("voiceFallback");
    L.textContent=t("error")+e.message;
  }
  chat.scrollTop=chat.scrollHeight;
}
btn.addEventListener("click",sendText);
input.addEventListener("keydown",function(e){if(e.key==="Enter")sendText();});
mic.addEventListener("pointerdown",startRecording);
mic.addEventListener("pointerup",stopRecording);
mic.addEventListener("pointerleave",stopRecording);
mic.addEventListener("pointercancel",stopRecording);

/* ---- three-dot menu ---- */
var menuBtn=document.getElementById("menuBtn"), menuDropdown=document.getElementById("menuDropdown");
menuBtn.addEventListener("click",function(e){
  e.stopPropagation();
  menuDropdown.classList.toggle("show");
});
document.addEventListener("click",function(){
  menuDropdown.classList.remove("show");
});

/* ---- language modal ---- */
function setLanguage(lang){
  currentLang = lang;
  lsSet("krishna_lang", lang);
  applyStaticText();
  if(greetingBubble){
    greetingBubble.textContent = t("greeting");
  }
}
document.querySelectorAll(".lang-choice").forEach(function(elm){
  elm.addEventListener("click",function(){
    var wasFirstLaunch = langModal.dataset.firstLaunch === "true";
    setLanguage(elm.getAttribute("data-lang"));
    langModal.classList.remove("show");
    if(wasFirstLaunch){
      langModal.dataset.firstLaunch = "false";
      greetingBubble = add(t("greeting"),"bot");
    }
  });
});
document.getElementById("langCloseBtn").addEventListener("click",function(){
  langModal.classList.remove("show");
});
document.getElementById("menuLangBtn").addEventListener("click",function(){
  document.getElementById("langCloseBtn").style.display="block";
  langModal.dataset.firstLaunch = "false";
  langModal.classList.add("show");
});

/* ---- profile page ---- */
document.getElementById("menuProfileBtn").addEventListener("click",function(){
  window.location.href = "profile.html";
});

/* ---- startup: ask language on first launch ---- */
if(!currentLang){
  document.getElementById("langCloseBtn").style.display="none";
  langModal.dataset.firstLaunch = "true";
  var LANG_POPUP_DELAY = 3000; /* milliseconds: 3000 = 3 seconds, change as you like */
  setTimeout(function(){
    if(!currentLang){ langModal.classList.add("show"); }
  }, LANG_POPUP_DELAY);
} else {
  applyStaticText();
  greetingBubble = add(t("greeting"),"bot");
  restoreHistory();
}

/* ---- if the free limit is already used up, show the paywall right away ---- */
if(!isUnlocked() && msgCount >= FREE_LIMIT){
  showPaywall();
}
</script>
