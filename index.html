<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>श्री कृष्ण वाणी</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;}
body{
  font-family:'Tiro Devanagari Hindi',Poppins,-apple-system,Segoe UI,Roboto,sans-serif;
  color:#f3f0ff;
  display:flex;
  flex-direction:column;
  height:100dvh;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(180deg, rgba(8,6,16,0.35) 0%, rgba(8,6,16,0.35) 30%, rgba(8,6,16,0.6) 55%, rgba(6,4,12,0.88) 78%, rgba(5,3,10,0.96) 100%),
    url('krishna-header.jpg') 40% center / cover no-repeat fixed;
}

header{
  position:relative;
  z-index:2;
  text-align:center;
  padding:22px 20px 16px;
  flex-shrink:0;
}
.menu-wrap{position:absolute;top:14px;left:14px;z-index:5}
.menu-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,217,138,0.4);
  background:rgba(10,7,20,0.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  box-shadow:0 2px 8px rgba(0,0,0,0.3);
}
.menu-btn span{
  display:block;width:18px;height:2px;border-radius:2px;
  background:#ffd98a;
  box-shadow:0 0 4px rgba(255,196,84,0.6);
}
.menu-dropdown{
  position:absolute;top:40px;left:0;min-width:150px;
  background:linear-gradient(180deg,#241a3f,#150f28);
  border:1px solid rgba(255,217,138,0.25);border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,0.5);
  overflow:hidden;display:none;
}
.menu-dropdown.show{display:block}
.menu-item{
  padding:12px 16px;font-size:13.5px;color:#f3f0ff;cursor:pointer;
  text-align:left;background:none;border:none;width:100%;
  font-family:inherit;
}
.menu-item:not(:last-child){border-bottom:1px solid rgba(255,217,138,0.12)}
.menu-item:active{background:rgba(255,217,138,0.1)}
.om-line{font-size:13px;letter-spacing:3px;color:#ffd98a;opacity:0.85;margin-bottom:6px}
header .title{
  font-size:27px;
  font-weight:700;
  letter-spacing:.5px;
  color:#fff;
  text-shadow:0 2px 12px rgba(0,0,0,0.75), 0 0 22px rgba(255,196,84,0.45);
}
header .sub{
  font-size:14px;
  color:#ffe9c2;
  margin-top:6px;
  font-weight:400;
  letter-spacing:.2px;
  text-shadow:0 1px 6px rgba(0,0,0,0.85);
}
.divider{
  width:70px;height:1.5px;margin:12px auto 0;
  background:linear-gradient(90deg, transparent, #ffd98a, transparent);
}

#chat{
  position:relative;
  z-index:2;
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px 14px 8px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
#chat::-webkit-scrollbar{width:0}
.row{display:flex;align-items:flex-end;gap:8px;animation:pop .28s ease}
.row.user{flex-direction:row-reverse}
.av{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.av.bot{background:linear-gradient(135deg,#ffe08a,#d4af37)}
.av.user{background:linear-gradient(135deg,#6a8dff,#8f6cff)}
.bubble{
  max-width:78%;padding:12px 15px;border-radius:18px;line-height:1.6;font-size:15px;
  white-space:pre-wrap;word-wrap:break-word;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.user .bubble{background:rgba(106,141,255,0.55);color:#fff;border:1px solid rgba(255,255,255,0.18);border-bottom-right-radius:6px}
.bot .bubble{background:rgba(20,14,34,0.55);border:1px solid rgba(255,217,138,0.22);color:#f6f1ff;border-bottom-left-radius:6px}
.typing{display:inline-flex;gap:4px;align-items:center}
.typing i{width:7px;height:7px;border-radius:50%;background:#c9b8ff;display:inline-block;animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.playbtn{
  display:inline-flex;align-items:center;gap:5px;margin-top:8px;
  background:rgba(255,217,138,0.14);border:1px solid rgba(255,217,138,0.35);
  color:#ffd98a;padding:6px 14px;border-radius:14px;font-size:12.5px;font-family:inherit;cursor:pointer;
}

#bar{
  position:relative;z-index:2;
  display:flex;gap:8px;
  flex-shrink:0;
  padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  background:rgba(10,7,20,0.55);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(255,217,138,0.18);
}
#msg{
  flex:1;min-width:0;padding:13px 16px;border-radius:24px;
  border:1px solid rgba(255,217,138,0.25);
  background:rgba(255,255,255,0.08);
  color:#fff;font-size:16px;font-family:inherit;outline:none;transition:border .2s;
}
#msg::placeholder{color:#c9bfe8}
#msg:focus{border-color:#ff9d6c}
#mic,#send{width:50px;height:50px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
#mic svg,#send svg{width:22px;height:22px}
#mic{border:1px solid rgba(255,217,138,0.35);background:rgba(255,217,138,0.12);color:#ffd98a;touch-action:none;user-select:none;-webkit-user-select:none}
#mic.rec{background:linear-gradient(135deg,#ff5f6d,#ff2d55);color:#fff;border-color:transparent;animation:pulse 1s infinite}
#send{border:none;background:linear-gradient(135deg,#ffb347,#ff7e5f);color:#fff;box-shadow:0 4px 14px rgba(255,126,95,.5)}
#send:active,#mic:active{transform:scale(.9)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,45,85,.6)}70%{box-shadow:0 0 0 12px rgba(255,45,85,0)}100%{box-shadow:0 0 0 0 rgba(255,45,85,0)}}

.modal-overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(5,3,10,0.72);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-card{
  background:linear-gradient(180deg,#241a3f,#150f28);
  border:1px solid rgba(255,217,138,0.25);
  border-radius:18px;
  padding:26px 24px 22px;
  max-width:320px;width:100%;
  text-align:center;
  box-shadow:0 30px 60px rgba(0,0,0,0.5);
  transform:translateY(10px);
  transition:transform .25s ease;
}
.modal-overlay.show .modal-card{transform:translateY(0)}
.modal-card .icon{font-size:34px;margin-bottom:10px}
.modal-card h3{margin:0 0 10px;font-size:18px;font-weight:700;color:#ffd98a}
.modal-card p{margin:0 0 20px;font-size:13.5px;color:#d8cdf0;line-height:1.6}
.modal-btn{
  display:inline-block;width:100%;
  background:linear-gradient(135deg,#ffd98a,#d4af37);
  color:#241a3f;font-weight:700;font-size:14.5px;
  padding:12px 0;border-radius:12px;
  text-decoration:none;border:none;cursor:pointer;
}
.modal-close{
  display:block;margin:14px auto 0;
  background:none;border:none;color:#9a90bb;
  font-size:12.5px;cursor:pointer;
}
.lang-btn-row{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.lang-choice{
  display:block;width:100%;padding:13px 0;border-radius:12px;
  background:rgba(255,217,138,0.1);border:1px solid rgba(255,217,138,0.35);
  color:#ffd98a;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
}
.lang-choice:active{background:rgba(255,217,138,0.2)}
.profile-row{display:flex;justify-content:space-between;font-size:13.5px;color:#d8cdf0;padding:8px 0;border-bottom:1px solid rgba(255,217,138,0.12)}
.profile-row:last-of-type{border-bottom:none}
</style></head><body>

<header>
  <div class="menu-wrap">
    <button class="menu-btn" id="menuBtn" title="Menu"><span></span><span></span><span></span></button>
    <div class="menu-dropdown" id="menuDropdown">
      <button class="menu-item" id="menuProfileBtn">प्रोफ़ाइल</button>
      <button class="menu-item" id="menuLangBtn">भाषा / Language</button>
    </div>
  </div>
  <div class="om-line">ॐ</div>
  <div class="title" id="headerTitle">श्री कृष्ण वाणी</div>
  <div class="divider"></div>
  <div class="sub" id="headerSub">आपके प्रश्न, श्री कृष्ण के उत्तर</div>
</header>

<div id="chat"></div>

<div id="bar">
<button id="mic" title="बोलें"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21a1 1 0 1 0 2 0v-3.08A7 7 0 0 0 19 11z"/></svg></button>
<input id="msg" placeholder="यहाँ अपना प्रश्न लिखें..." autocomplete="off">
<button id="send" title="भेजें"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4l17.45-7.48a1 1 0 0 0 0-1.84L3.4 3.6a1 1 0 0 0-1.4.92V9.6a1 1 0 0 0 .78.98L14 12 2.78 13.42a1 1 0 0 0-.78.98v5.08a1 1 0 0 0 1.4.92z"/></svg></button>
</div>

<div class="modal-overlay" id="subModal">
  <div class="modal-card">
    <div class="icon">🪷</div>
    <h3 id="paywallTitle">निःशुल्क सीमा पूरी हुई</h3>
    <p id="paywallText">आपने 5 प्रश्न पूछ लिए हैं। आगे बातचीत जारी रखने के लिए कृपया दक्षिणा अर्पित करें।</p>
    <a class="modal-btn" href="subscribe.html" target="_blank" rel="noopener" id="paywallBtn">दक्षिणा दें</a>
  </div>
</div>

<div class="modal-overlay" id="langModal">
  <div class="modal-card">
    <div class="icon">🌐</div>
    <h3 id="langTitle">अपनी भाषा चुनें / Choose your language</h3>
    <div class="lang-btn-row">
      <button class="lang-choice" data-lang="hi">हिंदी</button>
      <button class="lang-choice" data-lang="en">English</button>
    </div>
    <button class="modal-close" id="langCloseBtn" style="display:none">बंद करें / Close</button>
  </div>
</div>

<script>
var WEBHOOK_URL = "https://ishikagarg.app.n8n.cloud/webhook/gita-voice";
var chat=document.getElementById("chat"),input=document.getElementById("msg"),btn=document.getElementById("send"),mic=document.getElementById("mic");
var LOTUS=String.fromCodePoint(129719),PRAY=String.fromCodePoint(128591);

var TXT = {
  hi:{
    title:"श्री कृष्ण वाणी",
    sub:"आपके प्रश्न, श्री कृष्ण के उत्तर",
    placeholder:"यहाँ अपना प्रश्न लिखें...",
    micTitle:"बोलें",
    sendTitle:"भेजें",
    greeting:"नमस्ते प्रिय मित्र "+PRAY,
    listening:String.fromCodePoint(127908)+" सुन रहा हूँ...",
    voiceFallback:String.fromCodePoint(127908)+" (आपकी आवाज़)",
    noReply:"(कोई उत्तर नहीं)",
    error:"कुछ गड़बड़ हो गयी: ",
    micError:"माइक एक्सेस नहीं मिला: ",
    listenBtn:String.fromCodePoint(128266)+" सुनें",
    paywallTitle:"निःशुल्क सीमा पूरी हुई",
    paywallText:"आपने 5 प्रश्न पूछ लिए हैं। आगे बातचीत जारी रखने के लिए कृपया दक्षिणा अर्पित करें।",
    paywallBtn:"दक्षिणा दें",
    menuProfile:"प्रोफ़ाइल",
    menuLang:"भाषा / Language",
    langTitle:"अपनी भाषा चुनें / Choose your language",
    langClose:"बंद करें / Close",
    profileTitle:"प्रोफ़ाइल",
    profileMsgLabel:"पूछे गए प्रश्न",
    profileStatusLabel:"स्थिति",
    profileFree:"निःशुल्क उपयोगकर्ता",
    profilePaid:"सदस्यता सक्रिय",
    profileClose:"बंद करें"
  },
  en:{
    title:"Shri Krishna Vani",
    sub:"Your questions, Shri Krishna's answers",
    placeholder:"Type your question here...",
    micTitle:"Speak",
    sendTitle:"Send",
    greeting:"Namaste dear friend "+PRAY,
    listening:String.fromCodePoint(127908)+" Listening...",
    voiceFallback:String.fromCodePoint(127908)+" (your voice)",
    noReply:"(no reply)",
    error:"Something went wrong: ",
    micError:"Mic access denied: ",
    listenBtn:String.fromCodePoint(128266)+" Listen",
    paywallTitle:"Free limit reached",
    paywallText:"You've asked 5 questions. Please offer a small contribution to continue the conversation.",
    paywallBtn:"Contribute",
    menuProfile:"Profile",
    menuLang:"भाषा / Language",
    langTitle:"अपनी भाषा चुनें / Choose your language",
    langClose:"बंद करें / Close",
    profileTitle:"Profile",
    profileMsgLabel:"Questions asked",
    profileStatusLabel:"Status",
    profileFree:"Free user",
    profilePaid:"Subscription active",
    profileClose:"Close"
  }
};

var currentLang = localStorage.getItem("krishna_lang");
var greetingBubble = null;


function t(key){
  var lang = currentLang || "hi";
  return TXT[lang][key];
}

function applyStaticText(){
  document.getElementById("headerTitle").textContent = t("title");
  document.getElementById("headerSub").textContent = t("sub");
  input.placeholder = t("placeholder");
  mic.title = t("micTitle");
  btn.title = t("sendTitle");
  document.getElementById("paywallTitle").textContent = t("paywallTitle");
  document.getElementById("paywallText").textContent = t("paywallText");
  document.getElementById("paywallBtn").textContent = t("paywallBtn");
  document.getElementById("menuProfileBtn").textContent = t("menuProfile");
  document.getElementById("menuLangBtn").textContent = t("menuLang");
  document.getElementById("langTitle").textContent = t("langTitle");
  document.getElementById("langCloseBtn").textContent = t("langClose");
}

function add(txt,w){var row=document.createElement("div");row.className="row "+w;var av=document.createElement("div");av.className="av "+w;av.textContent=(w==="bot"?LOTUS:PRAY);var b=document.createElement("div");b.className="bubble";b.textContent=txt;row.appendChild(av);row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b;}
function addTyping(){var row=document.createElement("div");row.className="row bot";var av=document.createElement("div");av.className="av bot";av.textContent=LOTUS;var b=document.createElement("div");b.className="bubble";var ty=document.createElement("span");ty.className="typing";ty.appendChild(document.createElement("i"));ty.appendChild(document.createElement("i"));ty.appendChild(document.createElement("i"));b.appendChild(ty);row.appendChild(av);row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b;}
function play(b64){var a=new Audio("data:audio/wav;base64,"+b64);a.play();}
function addPlay(bubble,b64){var pb=document.createElement("button");pb.className="playbtn";pb.textContent=t("listenBtn");pb.onclick=function(){play(b64);};bubble.appendChild(document.createElement("br"));bubble.appendChild(pb);}

var msgCount = 0;
var subModal = document.getElementById("subModal");
var langModal = document.getElementById("langModal");
var FREE_LIMIT = 5;

function isUnlocked(){
  return localStorage.getItem("krishna_unlocked") === "true";
}
function showPaywall(){
  subModal.classList.add("show");
}
function canSendMessage(){
  if(isUnlocked()) return true;
  if(msgCount >= FREE_LIMIT){
    showPaywall();
    return false;
  }
  return true;
}

async function sendText(){var m=input.value.trim();if(!m)return;if(!canSendMessage())return;add(m,"user");input.value="";msgCount++;var L=addTyping();try{var res=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,sessionId:"mobile-user",lang:currentLang||"hi"})});var data=await res.json();L.textContent=data.reply||t("noReply");}catch(e){L.textContent=t("error")+e.message;}chat.scrollTop=chat.scrollHeight;}

var mediaRec=null,chunks=[],recording=false;
function startRecording(e){
  e.preventDefault();
  if(recording)return;
  if(!canSendMessage())return;
  if(e.pointerId!==undefined && mic.setPointerCapture){
    try{mic.setPointerCapture(e.pointerId);}catch(err){}
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaRec=new MediaRecorder(stream);
    chunks=[];
    mediaRec.ondataavailable=function(ev){
      if(ev.data && ev.data.size>0){chunks.push(ev.data);}
    };
    mediaRec.onstop=function(){
      recording=false;
      mic.classList.remove("rec");
      stream.getTracks().forEach(function(tr){tr.stop();});
      var finalBlob=new Blob(chunks,{type:"audio/webm"});
      if(finalBlob.size>0){sendVoice(finalBlob,"recording.webm");}
    };
    mediaRec.start();
    recording=true;
    mic.classList.add("rec");
  }).catch(function(e){
    alert(t("micError")+e.name+" - "+e.message);
  });
}
function stopRecording(e){
  if(e)e.preventDefault();
  if(recording && mediaRec){
    mediaRec.stop();
  }
}
async function sendVoice(blob,filename){
  var userBubble = add(t("listening"),"user");
  msgCount++;
  var L=addTyping();
  try{
    var fd=new FormData();
    fd.append("data",blob,filename||"recording.webm");
    fd.append("sessionId","mobile-user");
    fd.append("lang",currentLang||"hi");
    var res=await fetch(WEBHOOK_URL,{method:"POST",body:fd});
    var data=await res.json();
    if(data.transcript){
      userBubble.textContent = data.transcript;
    } else {
      userBubble.textContent = t("voiceFallback");
    }
    L.textContent=data.reply||t("noReply");
    if(data.audioBase64){addPlay(L,data.audioBase64);play(data.audioBase64);}
  }catch(e){
    userBubble.textContent = t("voiceFallback");
    L.textContent=t("error")+e.message;
  }
  chat.scrollTop=chat.scrollHeight;
}
btn.addEventListener("click",sendText);
input.addEventListener("keydown",function(e){if(e.key==="Enter")sendText();});
mic.addEventListener("pointerdown",startRecording);
mic.addEventListener("pointerup",stopRecording);
mic.addEventListener("pointerleave",stopRecording);
mic.addEventListener("pointercancel",stopRecording);

/* ---- three-dot menu ---- */
var menuBtn=document.getElementById("menuBtn"), menuDropdown=document.getElementById("menuDropdown");
menuBtn.addEventListener("click",function(e){
  e.stopPropagation();
  menuDropdown.classList.toggle("show");
});
document.addEventListener("click",function(){
  menuDropdown.classList.remove("show");
});

/* ---- language modal ---- */
function setLanguage(lang){
  currentLang = lang;
  localStorage.setItem("krishna_lang", lang);
  applyStaticText();
  if(greetingBubble){
    greetingBubble.textContent = t("greeting");
  }
}
document.querySelectorAll(".lang-choice").forEach(function(elm){
  elm.addEventListener("click",function(){
    var wasFirstLaunch = langModal.dataset.firstLaunch === "true";
    setLanguage(elm.getAttribute("data-lang"));
    langModal.classList.remove("show");
    if(wasFirstLaunch){
      langModal.dataset.firstLaunch = "false";
      greetingBubble = add(t("greeting"),"bot");
    }
  });
});
document.getElementById("langCloseBtn").addEventListener("click",function(){
  langModal.classList.remove("show");
});
document.getElementById("menuLangBtn").addEventListener("click",function(){
  document.getElementById("langCloseBtn").style.display="block";
  langModal.dataset.firstLaunch = "false";
  langModal.classList.add("show");
});

/* ---- profile modal ---- */
document.getElementById("menuProfileBtn").addEventListener("click",function(){
  window.location.href = "profile.html";
});

/* ---- startup: ask language on first launch ---- */
if(!currentLang){
  document.getElementById("langCloseBtn").style.display="none";
  langModal.dataset.firstLaunch = "true";
  langModal.classList.add("show");
} else {
  applyStaticText();
  greetingBubble = add(t("greeting"),"bot");
}
</script>

</body></html>
