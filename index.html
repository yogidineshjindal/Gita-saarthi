body::after{
  content:"";position:fixed;inset:0;z-index:6;pointer-events:none;
  background:radial-gradient(ellipse 130% 85% at 50% 20%, transparent 58%, rgba(46,59,66,0.05) 100%);
}

/* ---------- ambient gold dust (echoes the gold flecks in the lotus artwork) ---------- */
#dust{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.mote{
  position:absolute;border-radius:50%;
  background:radial-gradient(circle, rgba(216,179,95,0.95) 0%, rgba(216,179,95,0.3) 60%, transparent 78%);
  animation:drift linear infinite;
  opacity:0;
}
@keyframes drift{
  0%{transform:translate(0,0);opacity:0}
  10%{opacity:.65}
  50%{transform:translate(8px,-55vh)}
  90%{opacity:.4}
  100%{transform:translate(-6px,-100vh);opacity:0}
}

/* ---------- header ---------- */
header{
  position:relative;z-index:3;
  flex-shrink:0;
  padding:18px 18px 16px;
  display:flex;justify-content:center;
}
.header-row{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  text-align:center;
  margin-top:32px;
}
.header-photo{
  position:relative;flex-shrink:0;
  width:104px;height:128px;
  border-radius:14px;overflow:hidden;
  border:1.5px solid var(--gold);
  animation:riseIn 1.2s cubic-bezier(.22,1,.36,1) both, breathe 5.5s ease-in-out infinite 1.2s;
}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes breathe{
  0%,100%{box-shadow:0 8px 20px rgba(74,90,99,0.22), 0 0 0 4px rgba(255,255,255,0.55), 0 0 16px rgba(216,179,95,0.22);}
  50%{box-shadow:0 8px 24px rgba(74,90,99,0.24), 0 0 0 4px rgba(255,255,255,0.6), 0 0 32px rgba(216,179,95,0.48);}
}
.header-photo img{
  width:100%;height:100%;object-fit:cover;object-position:center 22%;display:block;
}
.header-text{
  min-width:0;
}
.menu-wrap{position:absolute;top:16px;left:16px;z-index:5}
.menu-btn{
  width:34px;height:34px;border-radius:9px;border:1px solid rgba(184,146,60,0.4);
  background:rgba(255,255,255,0.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.menu-btn span{display:block;width:15px;height:1.5px;border-radius:2px;background:var(--gold-deep)}
.menu-dropdown{
  position:absolute;top:40px;left:0;min-width:158px;
  background:var(--panel-deep);
  border:1px solid rgba(184,146,60,0.3);border-radius:12px;
  box-shadow:0 14px 30px rgba(74,90,99,0.22);overflow:hidden;display:none;
}
.menu-dropdown.show{display:block}
.menu-item{
  padding:12px 16px;font-size:13.5px;color:var(--ink);cursor:pointer;
  text-align:left;background:none;border:none;width:100%;font-family:inherit;
}
.menu-item:not(:last-child){border-bottom:1px solid rgba(184,146,60,0.15)}
.menu-item:active{background:rgba(184,146,60,0.1)}


header .title{
  margin-top:4px;
  font-family:'Tiro Devanagari Hindi',serif;
  font-size:25px;font-weight:400;letter-spacing:.4px;color:var(--slate-deep);
  text-shadow:0 1px 8px rgba(255,255,255,0.6);
  animation:fadeUp 1.1s ease both;animation-delay:.35s;
}
header .sub{
  font-size:13px;color:var(--ink-muted);margin-top:4px;font-weight:400;letter-spacing:.2px;
  animation:fadeUp 1.1s ease both;animation-delay:.6s;
}
.divider{
  width:58px;height:1px;margin:12px auto 0;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity:0;
  animation:fadeIn .9s ease both;animation-delay:.5s;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:.7}}

/* ---------- chat ---------- */
#chat{
  position:relative;z-index:2;flex:1;min-height:0;overflow-y:auto;
  padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px;
}
#chat::-webkit-scrollbar{width:0}
.row{display:flex;align-items:flex-end;gap:8px;animation:pop .5s cubic-bezier(.16,.8,.32,1) both}
.row.user{flex-direction:row-reverse}
.av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;border:1px solid rgba(184,146,60,0.4)}
.av.bot{background:linear-gradient(135deg,#EDE0C2,#D8B35F);color:var(--gold-deep)}
.av.user{background:linear-gradient(135deg,#e7ecee,#cfd8db);color:var(--slate-deep)}
.bubble{
  max-width:78%;padding:12px 15px;border-radius:16px;line-height:1.65;font-size:15px;
  white-space:pre-wrap;word-wrap:break-word;
  box-shadow:0 8px 20px rgba(74,90,99,.14);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.user .bubble{background:var(--user-glass);color:var(--slate-deep);border:1px solid rgba(74,90,99,0.28);border-bottom-right-radius:5px}
.bot .bubble{background:var(--bot-glass);border:1px solid rgba(184,146,60,0.45);color:var(--slate-deep);font-weight:600;border-bottom-left-radius:5px;box-shadow:0 8px 20px rgba(74,90,99,.2)}

/* soft waveform loading state */
.waveform{display:inline-flex;align-items:center;gap:3px;height:16px}
.waveform i{
  width:3px;border-radius:2px;background:var(--gold);display:inline-block;
  animation:wave 1s ease-in-out infinite;
}
.waveform i:nth-child(1){height:6px;animation-delay:0s}
.waveform i:nth-child(2){height:14px;animation-delay:.12s}
.waveform i:nth-child(3){height:9px;animation-delay:.24s}
.waveform i:nth-child(4){height:16px;animation-delay:.36s}
.waveform i:nth-child(5){height:7px;animation-delay:.48s}
@keyframes wave{0%,100%{transform:scaleY(.4);opacity:.55}50%{transform:scaleY(1);opacity:1}}

.playbtn{
  display:inline-flex;align-items:center;gap:6px;margin-top:8px;
  background:rgba(184,146,60,0.12);border:1px solid rgba(184,146,60,0.4);
  color:var(--gold-deep);padding:6px 14px;border-radius:13px;font-size:12.5px;font-family:inherit;cursor:pointer;
}

/* ---------- input bar ---------- */
#bar{
  position:relative;z-index:3;display:flex;gap:10px;flex-shrink:0;align-items:center;
  padding:13px 14px calc(13px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,0.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid rgba(184,146,60,0.3);
}
#bar::before{
  content:"";position:absolute;left:0;right:0;top:-1px;height:3px;
  background-image:radial-gradient(circle at 9px 3px, transparent 7px, rgba(184,146,60,0.4) 8px);
  background-size:18px 6px;background-repeat:repeat-x;background-position:center top;
}
#msg{
  flex:1;min-width:0;padding:13px 17px;border-radius:22px;
  border:1px solid rgba(184,146,60,0.4);
  background:rgba(255,255,255,0.8);
  color:var(--ink);font-size:16px;font-family:inherit;outline:none;transition:border .2s, box-shadow .2s;
  box-shadow:inset 0 1px 3px rgba(74,90,99,0.06);
}
#msg::placeholder{color:var(--ink-muted)}
#msg:focus{border-color:var(--slate);box-shadow:inset 0 1px 3px rgba(74,90,99,0.06), 0 0 0 3px rgba(74,90,99,0.08)}
#mic,#send{
  position:relative;width:50px;height:50px;flex-shrink:0;border-radius:50%;
  display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;
}
#mic::before,#send::before{
  content:"";position:absolute;inset:-4px;border-radius:50%;border:1px solid;opacity:.35;pointer-events:none;
}
#mic svg,#send svg{width:19px;height:19px;position:relative;z-index:1}
#mic{
  border:1.5px solid var(--slate);background:radial-gradient(circle at 35% 30%, #eef2f2, rgba(74,90,99,0.1));
  color:var(--slate-deep);touch-action:none;user-select:none;-webkit-user-select:none;
  box-shadow:0 3px 10px rgba(74,90,99,.18);
}
#mic::before{border-color:rgba(74,90,99,0.3)}
#mic.rec{background:linear-gradient(135deg,#d97a5f,#c05a3f);color:#fff;border-color:transparent;animation:pulse 1s infinite}
#mic.rec::before{border-color:transparent}
#send{
  border:1.5px solid var(--gold-deep);
  background:radial-gradient(circle at 35% 28%, var(--gold-light), var(--gold) 65%, var(--gold-deep));
  color:#3a2c0c;box-shadow:0 5px 16px rgba(184,146,60,.45), inset 0 1px 0 rgba(255,255,255,.5);
}
#send::before{border-color:rgba(184,146,60,0.4)}
#send:active,#mic:active{transform:scale(.9)}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,90,63,.5)}70%{box-shadow:0 0 0 12px rgba(192,90,63,0)}100%{box-shadow:0 0 0 0 rgba(192,90,63,0)}}

/* ---------- modals ---------- */
.modal-overlay{
  position:fixed;inset:0;z-index:50;
  background:radial-gradient(ellipse 420px 320px at 50% 42%, rgba(216,179,95,0.22), rgba(44,52,56,0.5) 68%);
  display:flex;align-items:center;justify-content:center;padding:24px;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal-card{
  position:relative;
  background:
    radial-gradient(circle at 8px 8px, rgba(184,146,60,0.15) 1px, transparent 1.2px) 0 0/16px 16px,
    var(--panel-deep, #fdfaf2);
  background-color:#fdfaf2;
  border-radius:6px;
  padding:40px 26px 26px;max-width:308px;width:100%;text-align:center;
  box-shadow:0 34px 70px rgba(44,52,56,0.4);
  transform:translateY(10px) scale(.97);opacity:0;
  transition:transform .55s cubic-bezier(.19,.72,.32,1), opacity .5s ease;
}
.modal-overlay.show .modal-card{transform:translateY(0) scale(1);opacity:1}
.modal-card::before{
  content:"";position:absolute;inset:7px;border:1px solid rgba(184,146,60,0.5);border-radius:3px;pointer-events:none;
}
.modal-card::after{
  content:"";position:absolute;left:0;right:0;top:0;height:5px;
  background-image:radial-gradient(circle at 10px 0, transparent 8px, rgba(184,146,60,0.55) 9px);
  background-size:20px 10px;background-position:center top;background-repeat:repeat-x;
}
.corner{position:absolute;width:16px;height:16px;opacity:.65;pointer-events:none}
.corner svg{width:100%;height:100%}
.corner.tl{top:11px;left:11px}
.corner.tr{top:11px;right:11px;transform:scaleX(-1)}
.corner.bl{bottom:11px;left:11px;transform:scaleY(-1)}
.corner.br{bottom:11px;right:11px;transform:scale(-1,-1)}

.crest{
  position:absolute;top:-30px;left:50%;transform:translateX(-50%);
  width:58px;height:58px;
}
.crest .ring{
  position:absolute;inset:0;border-radius:50%;
  background:var(--panel-deep,#fdfaf2);background-color:#fdfaf2;
  border:1.5px solid var(--gold);
  box-shadow:0 0 0 4px #fdfaf2, 0 8px 18px rgba(44,52,56,.28);
  display:flex;align-items:center;justify-content:center;
}
.crest svg{width:28px;height:28px}

.modal-card h3{margin:0 0 9px;font-size:19px;font-weight:400;color:var(--gold-deep);font-family:'Tiro Devanagari Hindi',serif;letter-spacing:.3px}
.modal-card p{margin:0 0 20px;font-size:13.5px;color:var(--ink-muted);line-height:1.65}

.modal-btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:linear-gradient(180deg,var(--gold-light),var(--gold) 60%,var(--gold-deep));
  color:#3a2c0c;font-weight:600;font-size:14.5px;padding:13px 0;border-radius:9px;
  text-decoration:none;border:none;cursor:pointer;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.55), 0 6px 16px rgba(138,106,38,.35);
}
.modal-btn::before,.modal-btn::after{content:"◆";font-size:7px;opacity:.75}
.modal-close{display:block;margin:16px auto 0;background:none;border:none;color:var(--ink-muted);font-size:12.5px;cursor:pointer;letter-spacing:.2px}
.lang-btn-row{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.lang-choice{
  display:block;width:100%;padding:13px 0;border-radius:9px;
  background:rgba(74,90,99,0.05);border:1px solid rgba(74,90,99,0.4);
  color:var(--slate-deep);font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
  transition:background .15s ease;
}
.lang-choice:active{background:rgba(74,90,99,0.16)}

    <a class="modal-btn" href="subscribe.html" target="_blank" rel="noopener" id="paywallBtn">दक्षिणा दें</a>

<div class="modal-overlay" id="langModal">
  <div class="modal-card">
    <div class="corner tl"><svg viewBox="0 0 16 16"><path d="M1 15 V4 Q1 1 4 1 H15" fill="none" stroke="var(--slate)" stroke-width="1.1"/></svg></div>
    <div class="corner tr"><svg viewBox="0 0 16 16"><path d="M1 15 V4 Q1 1 4 1 H15" fill="none" stroke="var(--slate)" stroke-width="1.1"/></svg></div>
    <div class="corner bl"><svg viewBox="0 0 16 16"><path d="M1 15 V4 Q1 1 4 1 H15" fill="none" stroke="var(--slate)" stroke-width="1.1"/></svg></div>
    <div class="corner br"><svg viewBox="0 0 16 16"><path d="M1 15 V4 Q1 1 4 1 H15" fill="none" stroke="var(--slate)" stroke-width="1.1"/></svg></div>
    <div class="crest">
      <div class="ring" style="border-color:var(--slate)">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <g fill="var(--slate)">
            <ellipse cx="14" cy="10" rx="3.2" ry="7.2"/>
            <ellipse cx="14" cy="10" rx="3.2" ry="7.2" transform="rotate(35 14 14)"/>
            <ellipse cx="14" cy="10" rx="3.2" ry="7.2" transform="rotate(-35 14 14)"/>
            <ellipse cx="14" cy="10" rx="3.2" ry="7.2" transform="rotate(70 14 14)"/>
            <ellipse cx="14" cy="10" rx="3.2" ry="7.2" transform="rotate(-70 14 14)"/>
          </g>
          <circle cx="14" cy="14" r="3.4" fill="var(--slate-deep)"/>
        </svg>
      </div>
    </div>
    <h3 id="langTitle">अपनी भाषा चुनें / Choose your language</h3>
    <div class="lang-btn-row">
      <button class="lang-choice" data-lang="hi">हिंदी</button>
      <button class="lang-choice" data-lang="en">English</button>
    </div>
    <button class="modal-close" id="langCloseBtn" style="display:none">बंद करें / Close</button>
  </div>
</div>

<script>
var WEBHOOK_URL = "https://ishikagarg.app.n8n.cloud/webhook/gita-voice";
var chat=document.getElementById("chat"),input=document.getElementById("msg"),btn=document.getElementById("send"),mic=document.getElementById("mic");
var LOTUS=String.fromCodePoint(129719),PRAY=String.fromCodePoint(128591);

/* ---- ambient gold dust particles ---- */
(function initDust(){
  var wrap = document.getElementById("dust");
  var COUNT = 10;
  for(var i=0;i<COUNT;i++){
    var d = document.createElement("div");
    d.className = "mote";
    var size = 2 + Math.random()*3;
    d.style.width = size+"px";
    d.style.height = size+"px";
    d.style.left = (Math.random()*100)+"%";
    d.style.top = (30+Math.random()*70)+"%";
    var dur = 20 + Math.random()*20;
    d.style.animationDuration = dur+"s";
    d.style.animationDelay = (-Math.random()*dur)+"s";
    wrap.appendChild(d);
  }
})();

/* ---- safe storage helpers (never crash if storage is blocked) ---- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var TXT = {
  hi:{
    title:"श्री कृष्ण वाणी",
    sub:"आपके प्रश्न, श्री कृष्ण के उत्तर",
    placeholder:"",
    micTitle:"बोलें",
    sendTitle:"भेजें",
    greeting:"नमस्ते प्रिय मित्र "+PRAY,
    listening:String.fromCodePoint(127908)+" सुन रहा हूँ...",
    voiceFallback:String.fromCodePoint(127908)+" (आपकी आवाज़)",
    noReply:"(कोई उत्तर नहीं)",
    error:"कुछ गड़बड़ हो गयी: ",
    micError:"माइक एक्सेस नहीं मिला: ",
    listenBtn:String.fromCodePoint(128266)+" सुनें",
    paywallTitle:"निःशुल्क सीमा पूरी हुई",
    paywallText:"आपने 3 प्रश्न पूछ लिए हैं। आगे बातचीत जारी रखने के लिए कृपया दक्षिणा अर्पित करें।",
    paywallBtn:"दक्षिणा दें",
    menuProfile:"प्रोफ़ाइल",
    menuLang:"भाषा / Language",
    langTitle:"अपनी भाषा चुनें / Choose your language",
    langClose:"बंद करें / Close",
    profileTitle:"प्रोफ़ाइल",
    profileMsgLabel:"पूछे गए प्रश्न",
    profileStatusLabel:"स्थिति",
    profileFree:"निःशुल्क उपयोगकर्ता",
    profilePaid:"सदस्यता सक्रिय",
    profileClose:"बंद करें"
  },
  en:{
    title:"Shri Krishna Vani",
    sub:"Your questions, Shri Krishna's answers",
    placeholder:"",
    micTitle:"Speak",
    sendTitle:"Send",
    greeting:"Namaste dear friend "+PRAY,
    listening:String.fromCodePoint(127908)+" Listening...",
    voiceFallback:String.fromCodePoint(127908)+" (your voice)",
    noReply:"(no reply)",
    error:"Something went wrong: ",
    micError:"Mic access denied: ",
    listenBtn:String.fromCodePoint(128266)+" Listen",
    paywallTitle:"Free limit reached",
    paywallText:"You've asked 3 questions. Please offer a small contribution to continue the conversation.",
    paywallBtn:"Contribute",
    menuProfile:"Profile",
    menuLang:"भाषा / Language",
    langTitle:"अपनी भाषा चुनें / Choose your language",
    langClose:"बंद करें / Close",
    profileTitle:"Profile",
    profileMsgLabel:"Questions asked",
    profileStatusLabel:"Status",
    profileFree:"Free user",
    profilePaid:"Subscription active",
    profileClose:"Close"
  }
};

var currentLang = lsGet("krishna_lang");
var greetingBubble = null;

function t(key){
  var lang = currentLang || "hi";
  return TXT[lang][key];
}

function applyStaticText(){
  document.getElementById("headerTitle").textContent = t("title");
  document.getElementById("headerSub").textContent = t("sub");
  input.placeholder = t("placeholder");
  mic.title = t("micTitle");
  btn.title = t("sendTitle");
  document.getElementById("paywallTitle").textContent = t("paywallTitle");
  document.getElementById("paywallText").textContent = t("paywallText");
  document.getElementById("paywallBtn").textContent = t("paywallBtn");
  document.getElementById("menuProfileBtn").textContent = t("menuProfile");
  document.getElementById("menuLangBtn").textContent = t("menuLang");
  document.getElementById("langTitle").textContent = t("langTitle");
  document.getElementById("langCloseBtn").textContent = t("langClose");
}

function add(txt,w){var row=document.createElement("div");row.className="row "+w;var av=document.createElement("div");av.className="av "+w;av.textContent=(w==="bot"?LOTUS:PRAY);var b=document.createElement("div");b.className="bubble";b.textContent=txt;row.appendChild(av);row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b;}
function addTyping(){
  var row=document.createElement("div");row.className="row bot";
  var av=document.createElement("div");av.className="av bot";av.textContent=LOTUS;
  var b=document.createElement("div");b.className="bubble";
  var wf=document.createElement("span");wf.className="waveform";
  for(var i=0;i<5;i++){wf.appendChild(document.createElement("i"));}
  b.appendChild(wf);
  row.appendChild(av);row.appendChild(b);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;return b;
}
function play(b64){var a=new Audio("data:audio/wav;base64,"+b64);a.play();}
function addPlay(bubble,b64){var pb=document.createElement("button");pb.className="playbtn";pb.textContent=t("listenBtn");pb.onclick=function(){play(b64);};bubble.appendChild(document.createElement("br"));bubble.appendChild(pb);}

/* ---- free-question limit (saved in the browser, survives reload) ---- */
var FREE_LIMIT = 3;
var msgCount = parseInt(lsGet("krishna_msgcount") || "0", 10);
if(isNaN(msgCount)) msgCount = 0;
function bumpCount(){
  msgCount++;
  lsSet("krishna_msgcount", String(msgCount));
}
var subModal = document.getElementById("subModal");
var langModal = document.getElementById("langModal");

function isUnlocked(){
  return lsGet("krishna_unlocked") === "true";
}
function showPaywall(){
  subModal.classList.add("show");
}
function canSendMessage(){
  if(isUnlocked()) return true;
  if(msgCount >= FREE_LIMIT){
    showPaywall();
    return false;
  }
  return true;
}

/* ---- device id (sent to the server so the limit can be enforced there too) ---- */
function getDeviceId(){
  var id = lsGet("krishna_device");
  if(!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ("d-" + Date.now() + "-" + Math.random().toString(36).slice(2));
    lsSet("krishna_device", id);
  }
  return id;
}

/* ---- chat history (saved in the browser, restored after reload) ---- */
var HISTORY_KEY = "krishna_history";
var MAX_HISTORY = 40;
function loadHistory(){
  try{
    var h = JSON.parse(lsGet(HISTORY_KEY) || "[]");
    return Array.isArray(h) ? h : [];
  }catch(e){ return []; }
}
function saveHistory(w, txt){
  if(!txt) return;
  var h = loadHistory();
  h.push({w:w, t:txt});
  if(h.length > MAX_HISTORY) h = h.slice(h.length - MAX_HISTORY);
  lsSet(HISTORY_KEY, JSON.stringify(h));
}
function restoreHistory(){
  loadHistory().forEach(function(item){
    if(item && item.t && (item.w === "user" || item.w === "bot")){
      add(item.t, item.w);
    }
  });
}

/* server says the limit is reached: sync the local count and show the paywall */
function handleLimitReached(typingBubble){
  msgCount = FREE_LIMIT;
  lsSet("krishna_msgcount", String(FREE_LIMIT));
  if(typingBubble && typingBubble.parentNode && typingBubble.parentNode.parentNode){
    typingBubble.parentNode.parentNode.removeChild(typingBubble.parentNode);
  }
  showPaywall();
}

async function sendText(){
  var m=input.value.trim();
  if(!m)return;
  if(!canSendMessage())return;
  add(m,"user");
  saveHistory("user", m);
  input.value="";
  bumpCount();
  var L=addTyping();
  try{
    var res=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:m,sessionId:"mobile-user",lang:currentLang||"hi",deviceId:getDeviceId(),phone:lsGet("krishna_phone")||""})});
    var data=await res.json();
    if(data.limitReached){handleLimitReached(L);return;}
    var reply=data.reply||t("noReply");
    L.textContent=reply;
    saveHistory("bot", reply);
  }catch(e){
    L.textContent=t("error")+e.message;
  }
  chat.scrollTop=chat.scrollHeight;
}

var mediaRec=null,chunks=[],recording=false;
function startRecording(e){
  e.preventDefault();
  if(recording)return;
  if(!canSendMessage())return;
  if(e.pointerId!==undefined && mic.setPointerCapture){
    try{mic.setPointerCapture(e.pointerId);}catch(err){}
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    mediaRec=new MediaRecorder(stream);
    chunks=[];
    mediaRec.ondataavailable=function(ev){
      if(ev.data && ev.data.size>0){chunks.push(ev.data);}
    };
    mediaRec.onstop=function(){
      recording=false;
      mic.classList.remove("rec");
      stream.getTracks().forEach(function(tr){tr.stop();});
      var finalBlob=new Blob(chunks,{type:"audio/webm"});
      if(finalBlob.size>0){sendVoice(finalBlob,"recording.webm");}
    };
    mediaRec.start();
    recording=true;
    mic.classList.add("rec");
  }).catch(function(e){
    alert(t("micError")+e.name+" - "+e.message);
  });
}
function stopRecording(e){
  if(e)e.preventDefault();
  if(recording && mediaRec){
    mediaRec.stop();
  }
}
async function sendVoice(blob,filename){
  var userBubble = add(t("listening"),"user");
  bumpCount();
  var L=addTyping();
  try{
    var fd=new FormData();
    fd.append("data",blob,filename||"recording.webm");
    fd.append("sessionId","mobile-user");
    fd.append("lang",currentLang||"hi");
    fd.append("deviceId",getDeviceId());
    fd.append("phone",lsGet("krishna_phone")||"");
    var res=await fetch(WEBHOOK_URL,{method:"POST",body:fd});
    var data=await res.json();
    if(data.limitReached){
      if(userBubble.parentNode && userBubble.parentNode.parentNode){
        userBubble.parentNode.parentNode.removeChild(userBubble.parentNode);
      }
      handleLimitReached(L);
      return;
    }
    if(data.transcript){
      userBubble.textContent = data.transcript;
    } else {
      userBubble.textContent = t("voiceFallback");
    }
    saveHistory("user", userBubble.textContent);
    var reply=data.reply||t("noReply");
    L.textContent=reply;
    saveHistory("bot", reply);
    if(data.audioBase64){addPlay(L,data.audioBase64);play(data.audioBase64);}
  }catch(e){
    userBubble.textContent = t("voiceFallback");
    L.textContent=t("error")+e.message;
  }
  chat.scrollTop=chat.scrollHeight;
}
btn.addEventListener("click",sendText);
input.addEventListener("keydown",function(e){if(e.key==="Enter")sendText();});
mic.addEventListener("pointerdown",startRecording);
mic.addEventListener("pointerup",stopRecording);
mic.addEventListener("pointerleave",stopRecording);
mic.addEventListener("pointercancel",stopRecording);

/* ---- three-dot menu ---- */
var menuBtn=document.getElementById("menuBtn"), menuDropdown=document.getElementById("menuDropdown");
menuBtn.addEventListener("click",function(e){
  e.stopPropagation();
  menuDropdown.classList.toggle("show");
});
document.addEventListener("click",function(){
  menuDropdown.classList.remove("show");
});

/* ---- language modal ---- */
function setLanguage(lang){
  currentLang = lang;
  lsSet("krishna_lang", lang);
  applyStaticText();
  if(greetingBubble){
    greetingBubble.textContent = t("greeting");
  }
}
document.querySelectorAll(".lang-choice").forEach(function(elm){
  elm.addEventListener("click",function(){
    var wasFirstLaunch = langModal.dataset.firstLaunch === "true";
    setLanguage(elm.getAttribute("data-lang"));
    langModal.classList.remove("show");
    if(wasFirstLaunch){
      langModal.dataset.firstLaunch = "false";
      greetingBubble = add(t("greeting"),"bot");
    }
  });
});
document.getElementById("langCloseBtn").addEventListener("click",function(){
  langModal.classList.remove("show");
});
document.getElementById("menuLangBtn").addEventListener("click",function(){
  document.getElementById("langCloseBtn").style.display="block";
  langModal.dataset.firstLaunch = "false";
  langModal.classList.add("show");
});

/* ---- profile page ---- */
document.getElementById("menuProfileBtn").addEventListener("click",function(){
  window.location.href = "profile.html";
});

/* ---- startup: ask language on first launch ---- */
if(!currentLang){
  document.getElementById("langCloseBtn").style.display="none";
  langModal.dataset.firstLaunch = "true";
  var LANG_POPUP_DELAY = 3000; /* milliseconds: 3000 = 3 seconds, change as you like */
  setTimeout(function(){
    if(!currentLang){ langModal.classList.add("show"); }
  }, LANG_POPUP_DELAY);
} else {
  applyStaticText();
  greetingBubble = add(t("greeting"),"bot");
  restoreHistory();
}

/* ---- if the free limit is already used up, show the paywall right away ---- */
if(!isUnlocked() && msgCount >= FREE_LIMIT){
  showPaywall();
}
</script>

</body></html>
